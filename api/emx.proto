syntax = "proto3";

package emx.v1;

option go_package = "github.com/ehsan200/em-xray/api/emxv1;emxv1";

// Daemon is the control surface the CLI/TUI drives over the unix socket.
service Daemon {
  // Lifecycle / health.
  rpc Ping(PingRequest) returns (PingReply);
  rpc Status(StatusRequest) returns (StatusReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);

  // Diagnostics / settings.
  rpc XrayConfig(Empty) returns (ConfigReply);        // the generated xray config.json
  rpc LogLevel(LogLevelRequest) returns (LogLevelReply); // set (non-empty) and/or read
  rpc LogCap(LogCapRequest) returns (LogCapReply);       // per-file log size cap (MB)

  // Templates.
  rpc TemplateList(Empty) returns (TemplateListReply);

  // Entries (outbounds; a non-empty dialer makes one a master).
  rpc EntryAdd(EntryAddRequest) returns (EntryReply);
  rpc EntryList(Empty) returns (EntryListReply);
  rpc EntryRemove(IdRequest) returns (Empty);
  rpc EntryRename(RenameRequest) returns (Empty);
  rpc EntryDuplicate(DuplicateRequest) returns (EntryReply);
  rpc EntryGetConfig(IdRequest) returns (ConfigReply);     // raw outbound JSON
  rpc EntrySetConfig(SetConfigRequest) returns (EntryReply);

  // Inbounds (server listeners routed to a target).
  rpc InboundAdd(InboundAddRequest) returns (InboundReply);
  rpc InboundList(Empty) returns (InboundListReply);
  rpc InboundRemove(IdRequest) returns (Empty);
  rpc InboundDuplicate(DuplicateRequest) returns (InboundReply);
  rpc InboundGetConfig(IdRequest) returns (ConfigReply);    // editable inbound JSON
  rpc InboundSetConfig(SetConfigRequest) returns (InboundReply);

  // Multi-user: extra clients on an inbound with per-user traffic + byte caps.
  rpc InboundUserAdd(InboundUserAddRequest) returns (InboundUserReply);
  rpc InboundUserList(IdRequest) returns (InboundUserListReply); // id = inbound id
  rpc InboundUserRemove(IdRequest) returns (Empty);             // id = user id
  rpc InboundUserSetEnabled(SetEnabledRequest) returns (Empty); // id = user id

  // Winner: the current fastest (balancer-selected) node per master.
  rpc Winners(Empty) returns (WinnersReply);

  // Traffic: per-inbound/outbound byte totals + hourly buckets for charts.
  rpc Traffic(TrafficRequest) returns (TrafficReply);
  // TrafficLive: current cumulative counters, for a client-computed live rate.
  rpc TrafficLive(Empty) returns (TrafficLiveReply);
  // TrafficRetention: read/set how many days of hourly buckets are kept.
  rpc TrafficRetention(TrafficRetentionRequest) returns (TrafficRetentionReply);

  // Backup / restore the full config (inbounds + entries + subscriptions).
  rpc ExportConfig(Empty) returns (ConfigReply);
  rpc ImportConfig(ImportRequest) returns (ImportReply);

  // Subscriptions (node pools consumed by masters via xraysub:NAME).
  rpc SubAdd(SubAddRequest) returns (SubReply);
  rpc SubList(Empty) returns (SubListReply);
  rpc SubRemove(IdRequest) returns (Empty);
  rpc SubSetEnabled(SetEnabledRequest) returns (Empty);
  rpc SubRefresh(SubRefreshRequest) returns (SubRefreshReply);
  rpc SubNodes(IdRequest) returns (SubNodesReply);
  rpc SubSetNodeDisabled(SubNodeDisabledRequest) returns (Empty);
  rpc SubRename(RenameRequest) returns (Empty);
  rpc SubSetOptions(SubOptionsRequest) returns (SubReply);
}

// SubOptionsRequest changes a subscription's refresh cadence / cap / UA.
message SubOptionsRequest {
  uint32 id = 1;
  int32 interval_sec = 2; // 0 => 12h default
  int32 node_cap = 3;     // 0 => 30 default
  string user_agent = 4;  // "" => v2rayN default
}

message RenameRequest {
  uint32 id = 1;
  string new_name = 2;
}

message SetEnabledRequest {
  uint32 id = 1;
  bool enabled = 2;
}

message WinnerInfo {
  string master = 1;
  string node = 2; // winning member name ("" if none selected yet)
  string tag = 3;  // slotN-out-<key>
}
message WinnersReply { repeated WinnerInfo winners = 1; }

message TrafficRequest { int64 window_sec = 1; } // 0 => 24h
message TrafficItem {
  string kind = 1;  // inbound|outbound
  string name = 2;
  int64 total_up = 3;   // lifetime
  int64 total_down = 4;
  int64 window_up = 5;  // within the requested window
  int64 window_down = 6;
  repeated int64 hourly_up = 7;   // per-hour, oldest→newest, len == buckets
  repeated int64 hourly_down = 8;
}
message TrafficReply {
  repeated TrafficItem inbounds = 1;
  repeated TrafficItem outbounds = 2;
  int64 window_sec = 3;
  int32 buckets = 4; // number of hourly buckets in each hourly_* array
}

message LiveItem {
  string kind = 1; // inbound|outbound
  string name = 2;
  int64 up = 3;    // cumulative bytes since xray started
  int64 down = 4;
}
message TrafficLiveReply { repeated LiveItem items = 1; }

// TrafficRetentionRequest sets the retention (days ≥ 1) when change=true; always
// returns the current value.
message TrafficRetentionRequest {
  int32 set_days = 1;
  bool change = 2;
}
message TrafficRetentionReply { int32 days = 1; }

message SubAddRequest {
  string name = 1;
  string url = 2;
  string user_agent = 3;
  int32 interval_sec = 4;
  int32 node_cap = 5;
}
message SubInfo {
  uint32 id = 1;
  string name = 2;
  string url = 3;
  bool enabled = 4;
  int32 node_count = 5;
  int32 active_count = 6;
  string last_error = 7;
  int64 upload = 8;
  int64 download = 9;
  int64 total = 10;
  int64 expire = 11;
  int64 last_fetched = 12; // unix seconds; 0 => never
  string user_agent = 13;
  int32 interval_sec = 14;
  int32 node_cap = 15;
}
message SubReply { SubInfo sub = 1; }
message SubListReply { repeated SubInfo subs = 1; }

message SubRefreshRequest { uint32 id = 1; } // 0 => all enabled
message SubRefreshReply {
  int32 nodes = 1;
  int32 added = 2;   // nodes present now but not before
  int32 removed = 3; // nodes present before but not now
}

message NodeInfo {
  string fingerprint = 1;
  string name = 2;
  bool active = 3;
  bool disabled = 4;
  int32 latency_ms = 5;
}
message SubNodesReply { repeated NodeInfo nodes = 1; }

message SubNodeDisabledRequest {
  uint32 sub_id = 1;
  string fingerprint = 2;
  bool disabled = 3;
}

message Empty {}
message IdRequest { uint32 id = 1; }

// Duplicate an existing inbound/entry under a new name.
message DuplicateRequest {
  uint32 id = 1;
  string new_name = 2; // "" => "<source> copy"
}
// ConfigReply carries a config as pretty-printed JSON for editing.
message ConfigReply { string json = 1; }
// SetConfigRequest replaces a config from edited JSON.
message SetConfigRequest {
  uint32 id = 1;
  string json = 2;
}

// ImportRequest restores a config backup. replace=true wipes existing config
// first; replace=false merges, skipping name conflicts.
message ImportRequest {
  string json = 1;
  bool replace = 2;
}
message ImportReply {
  int32 inbounds = 1;
  int32 entries = 2;
  int32 subs = 3;
  repeated string skipped = 4; // names skipped on conflict (merge mode)
}

message PingRequest {}
message PingReply {
  string version = 1;
  string xray_version = 2;
}

message StatusRequest {}
message StatusReply {
  int32 daemon_pid = 1;
  int64 uptime_sec = 2;
  XrayState xray = 3;
  string latest_version = 4;   // newest release tag the daemon has seen ("" = unknown)
  bool update_available = 5;   // latest_version is newer than the running build
}
message XrayState {
  bool running = 1;
  int32 pid = 2;
  int32 restarts = 3;
  string last_error = 4;
}

message ShutdownRequest {}
message ShutdownReply {}

// LogLevelRequest sets the xray log level when set is non-empty; always returns
// the current level. Valid: debug|info|warning|error|none.
message LogLevelRequest { string set = 1; }
message LogLevelReply { string level = 1; }

// LogCapRequest changes the per-file log cap (MB) when change=true (0 disables
// rotation); always returns the current cap. Peak on-disk per log is ~2× cap.
message LogCapRequest {
  int32 set_mb = 1;
  bool change = 2;
}
message LogCapReply { int32 mb = 1; }

message Template {
  string name = 1;
  string description = 2;
  string protocol = 3;
  string network = 4;
  string security = 5;
}
message TemplateListReply { repeated Template templates = 1; }

message EntryAddRequest {
  string name = 1;
  string link = 2;          // share link to parse into an outbound (optional)
  string outbound_json = 3; // raw outbound JSON (alternative to link)
  string dialer = 4;        // non-empty => master
  bool enabled = 5;
}
message EntryInfo {
  uint32 id = 1;
  string name = 2;
  bool enabled = 3;
  bool is_master = 4;
  string dialer = 5;
}
message EntryReply { EntryInfo entry = 1; }
message EntryListReply { repeated EntryInfo entries = 1; }

message InboundAddRequest {
  string name = 1;
  string template = 2;    // "" => default (vless-reality)
  string target = 3;      // master:NAME | xray:NAME | direct
  string public_host = 4; // address clients dial (for the share link)
  int32 port = 5;         // 0 => auto-assign
}
message InboundInfo {
  uint32 id = 1;
  string name = 2;
  string protocol = 3;
  int32 port = 4;
  string security = 5;
  string target = 6;
  bool enabled = 7;
  string uuid = 8;
  string public_host = 9;
  string share_link = 10;
}
message InboundReply { InboundInfo inbound = 1; }
message InboundListReply { repeated InboundInfo inbounds = 1; }

message InboundUserAddRequest {
  uint32 inbound_id = 1;
  string name = 2;
  int64 byte_cap = 3; // 0 = unlimited
}
message UserInfo {
  uint32 id = 1;
  string name = 2;
  bool enabled = 3;
  int64 byte_cap = 4;
  int64 used_up = 5;
  int64 used_down = 6;
  bool over_cap = 7;
  string share_link = 8;
}
message InboundUserReply { UserInfo user = 1; }
message InboundUserListReply { repeated UserInfo users = 1; }
